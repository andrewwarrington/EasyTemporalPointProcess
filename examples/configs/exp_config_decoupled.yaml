pipeline_config_id: runner_config

data:
  lastfm:
    data_format: json
    train_dir: examples/data/lastfm_json/train.json
    valid_dir: examples/data/lastfm_json/dev.json
    test_dir: examples/data/lastfm_json/test.json
    data_specs:
      num_event_types: 120
      pad_token_id: 120
      padding_side: right
      truncation_side: right
  mimicii_jitter:
    data_format: json
    train_dir: examples/data/mimicii_jitter/train_jitter.json
    valid_dir: examples/data/mimicii_jitter/dev_jitter.json
    test_dir: examples/data/mimicii_jitter/test_jitter.json
    data_specs:
      num_event_types: 75
      pad_token_id: 75
      padding_side: right
      truncation_side: right
  retweet_jitter:
    data_format: json
    train_dir: examples/data/retweet_jitter/train_jitter.json
    valid_dir: examples/data/retweet_jitter/dev_jitter.json
    test_dir: examples/data/retweet_jitter/test_jitter.json
    data_specs:
      num_event_types: 3
      pad_token_id: 3
      padding_side: right
      truncation_side: right
  stackoverflow:
    data_format: json
    train_dir: examples/data/stackoverflow_json/train.json
    valid_dir: examples/data/stackoverflow_json/dev.json
    test_dir: examples/data/stackoverflow_json/test.json
    data_specs:
      num_event_types: 22
      pad_token_id: 22
      padding_side: right
      truncation_side: right

_common_trainer_config: &common_trainer_config
  # The Dec-ODE appendix specifies model/solver defaults, not a universal
  # batch size or epoch budget. These stay as simple EasyTPP training knobs.
  batch_size: 256
  max_epoch: 300
  shuffle: False
  optimizer: adam
  learning_rate: 1.e-3
  valid_freq: 1
  use_tfb: False
  metrics: [ 'acc', 'rmse' ]
  lr_scheduler: True
  weight_decay: 1.e-5
  warmup_pct: 0.01
  lr_decay_style: cosine
  seed: 2019
  gpu: -1

_common_thinning: &common_thinning
  num_seq: 10
  num_sample: 1
  num_exp: 500
  look_ahead_time: 10
  patience_counter: 5
  over_sample_rate: 5
  num_samples_boundary: 5
  dtime_max: 5

_decoupled_model_config: &decoupled_model_config
  # Paper defaults used in most cases: D=64, ODE width N=256, layers L=3.
  # Training uses Euler with 16 fixed steps; evaluation uses RK4 with 64.
  hidden_size: 64
  num_layers: 3
  loss_integral_num_sample_per_step: 10
  use_mc_samples: False
  thinning: *common_thinning
  model_specs:
    ode_hidden_size: 256
    num_ode_layers: 3
    ode_steps: 16
    ode_solver: euler
    eval_ode_steps: 64
    eval_ode_solver: rk4
    ode_dropout: 0.0
    combine_mode: linear
    intensity_floor: 1.e-8

# Decoupled: Decoupled Marked Temporal Point Process Using Neural ODEs
# Ref: Song et al., ICLR 2024
# Model defaults mirror the paper appendix training details.
Decoupled_lastfm_train:
  base_config:
    stage: train
    backend: torch
    dataset_id: lastfm
    runner_id: std_tpp
    model_id: Decoupled
    base_dir: './checkpoints/'
  trainer_config: *common_trainer_config
  model_config: *decoupled_model_config

Decoupled_mimicii_jitter_train:
  base_config:
    stage: train
    backend: torch
    dataset_id: mimicii_jitter
    runner_id: std_tpp
    model_id: Decoupled
    base_dir: './checkpoints/'
  trainer_config: *common_trainer_config
  model_config: *decoupled_model_config

Decoupled_retweet_jitter_train:
  base_config:
    stage: train
    backend: torch
    dataset_id: retweet_jitter
    runner_id: std_tpp
    model_id: Decoupled
    base_dir: './checkpoints/'
  trainer_config: *common_trainer_config
  model_config: *decoupled_model_config

Decoupled_stackoverflow_train:
  base_config:
    stage: train
    backend: torch
    dataset_id: stackoverflow
    runner_id: std_tpp
    model_id: Decoupled
    base_dir: './checkpoints/'
  trainer_config: *common_trainer_config
  model_config: *decoupled_model_config
