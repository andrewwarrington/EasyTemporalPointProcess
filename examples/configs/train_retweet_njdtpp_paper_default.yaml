pipeline_config_id: runner_config

data:
  retweet:
    data_format: json
    train_dir: easytpp/retweet
    valid_dir: easytpp/retweet
    test_dir: easytpp/retweet
    data_specs:
      num_event_types: 3
      pad_token_id: 3
      padding_side: right
      truncation_side: right

NJDTPP_retweet_paper_default:
  base_config:
    stage: train
    backend: torch
    dataset_id: retweet
    runner_id: std_tpp
    model_id: NJDTPP
    base_dir: './checkpoints/retweet_njdtpp_paper_default/'
    specs:
      paper: "Zhang et al. 2024, Neural Jump-Diffusion Temporal Point Processes"
      source: "https://proceedings.mlr.press/v235/zhang24cm.html"
      note: "Retweet paper/source defaults adapted to the EasyTPP epoch runner."
  trainer_config:
    batch_size: 30
    max_epoch: 5
    shuffle: false
    optimizer: adam
    learning_rate: 1.0e-3
    valid_freq: 1
    use_tfb: false
    metrics: ['acc', 'rmse']
    seed: 2019
    gpu: -1
    lr_scheduler: true
    weight_decay: 1.0e-5
    warmup_pct: 0.01
    lr_decay_style: cosine
  model_config:
    hidden_size: 32
    num_layers: 2
    loss_integral_num_sample_per_step: 11
    use_mc_samples: false
    model_specs:
      hidden_size: 32
      num_hidden_layers: 2
      num_sde_steps: 10
      activation: tanh
      init_std: 0.01
      eta0_init_mean: 0.0
      eta0_init_std: 0.1
      eta0_learning_rate: 1.0e-1
      diffusion_scale: 1.0
      eval_diffusion_scale: 0.0
      log_intensity_clip: 20.0
