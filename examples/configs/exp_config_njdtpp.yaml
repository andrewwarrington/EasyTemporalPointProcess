pipeline_config_id: runner_config

data:
  lastfm:
    data_format: json
    train_dir: examples/data/lastfm_json/train.json
    valid_dir: examples/data/lastfm_json/dev.json
    test_dir: examples/data/lastfm_json/test.json
    data_specs:
      num_event_types: 120
      pad_token_id: 120
      padding_side: right
      truncation_side: right
  mimicii_jitter:
    data_format: json
    train_dir: examples/data/mimicii_jitter/train_jitter.json
    valid_dir: examples/data/mimicii_jitter/dev_jitter.json
    test_dir: examples/data/mimicii_jitter/test_jitter.json
    data_specs:
      num_event_types: 75
      pad_token_id: 75
      padding_side: right
      truncation_side: right
  retweet_jitter:
    data_format: json
    train_dir: examples/data/retweet_jitter/train_jitter.json
    valid_dir: examples/data/retweet_jitter/dev_jitter.json
    test_dir: examples/data/retweet_jitter/test_jitter.json
    data_specs:
      num_event_types: 3
      pad_token_id: 3
      padding_side: right
      truncation_side: right
  stackoverflow:
    data_format: json
    train_dir: examples/data/stackoverflow_json/train.json
    valid_dir: examples/data/stackoverflow_json/dev.json
    test_dir: examples/data/stackoverflow_json/test.json
    data_specs:
      num_event_types: 22
      pad_token_id: 22
      padding_side: right
      truncation_side: right

_common_trainer_config: &common_trainer_config
  # The released NJDTPP scripts train with 3000 random minibatch iterations.
  # EasyTPP is epoch-based, so max_epoch is the practical run budget here.
  batch_size: 30
  max_epoch: 10
  shuffle: True
  optimizer: adam
  learning_rate: 1.e-3
  valid_freq: 1
  use_tfb: False
  metrics: [ 'acc', 'rmse' ]
  lr_scheduler: True
  weight_decay: 1.e-5
  warmup_pct: 0.01
  lr_decay_style: cosine
  seed: 42
  gpu: -1

_common_thinning: &common_thinning
  num_seq: 10
  num_sample: 1
  num_exp: 500
  look_ahead_time: 10
  patience_counter: 5
  over_sample_rate: 5
  num_samples_boundary: 5
  dtime_max: 5

_njdtpp_model_config: &njdtpp_model_config
  # Paper/code defaults: hidden=32, hidden layers=2, tanh activation,
  # Euler-Maruyama num_divide=10, init std=0.01, eta0 std=0.1.
  hidden_size: 32
  num_layers: 2
  # EasyTPP counts both interval endpoints; the released code uses 10
  # sub-intervals and therefore records 11 states for likelihood integration.
  loss_integral_num_sample_per_step: 11
  use_mc_samples: False
  thinning: *common_thinning
  model_specs:
    hidden_size: 32
    num_hidden_layers: 2
    num_sde_steps: 10
    activation: tanh
    init_std: 0.01
    eta0_init_mean: 0.0
    eta0_init_std: 0.1
    eta0_learning_rate: 1.e-1
    diffusion_scale: 1.0
    eval_diffusion_scale: 0.0
    log_intensity_clip: 20.0

# NJDTPP: Neural Jump-Diffusion Temporal Point Process
# Ref: Zhang et al., ICML 2024
# Model defaults mirror the authors' released reproduction scripts.
NJDTPP_lastfm_train:
  base_config:
    stage: train
    backend: torch
    dataset_id: lastfm
    runner_id: std_tpp
    model_id: NJDTPP
    base_dir: './checkpoints/'
  trainer_config: *common_trainer_config
  model_config: *njdtpp_model_config

NJDTPP_mimicii_jitter_train:
  base_config:
    stage: train
    backend: torch
    dataset_id: mimicii_jitter
    runner_id: std_tpp
    model_id: NJDTPP
    base_dir: './checkpoints/'
  trainer_config: *common_trainer_config
  model_config: *njdtpp_model_config

NJDTPP_retweet_jitter_train:
  base_config:
    stage: train
    backend: torch
    dataset_id: retweet_jitter
    runner_id: std_tpp
    model_id: NJDTPP
    base_dir: './checkpoints/'
  trainer_config: *common_trainer_config
  model_config: *njdtpp_model_config

NJDTPP_stackoverflow_train:
  base_config:
    stage: train
    backend: torch
    dataset_id: stackoverflow
    runner_id: std_tpp
    model_id: NJDTPP
    base_dir: './checkpoints/'
  trainer_config: *common_trainer_config
  model_config: *njdtpp_model_config
